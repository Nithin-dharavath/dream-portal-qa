<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreams Total</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="main-container">
        <div class="content-wrapper">
            <h1>Dreams Summary</h1>
            <table id="dreamsTotal">
                <thead>
                    <tr>
                        <th>Dream Type</th>
                        <th>Total Count</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Good Dreams</td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td>Bad Dreams</td>
                        <td>4</td>
                    </tr>
                    <tr>
                        <td>Total Dreams</td>
                        <td>10</td>
                    </tr>
                    <tr>
                        <td>Dreams This Week</td>
                        <td>7</td>
                    </tr>
                    <tr>
                        <td>Recurring Dreams</td>
                        <td>2</td>  <!-- "Flying over mountains" appears 3 times, "Lost in maze" appears 2 times -->
                    </tr>
                </tbody>
            </table>
        </div>
